services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: foodjournal
      POSTGRES_USER: foodjournal
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-foodjournal}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodjournal -d foodjournal"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports: ["127.0.0.1:5432:5432"]
  app:
    build: .
    init: true
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    # Keep a deliberate memory ceiling rather than allowing an unbounded process.
    mem_limit: 512m
    mem_reservation: 256m
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/foodjournal
      DATABASE_USERNAME: foodjournal
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-foodjournal}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      ADMIN_TELEGRAM_USER_IDS: ${ADMIN_TELEGRAM_USER_IDS}
      ALLOWED_TELEGRAM_USER_IDS: ${ALLOWED_TELEGRAM_USER_IDS:-}
      TELEGRAM_FRONTEND_ENABLED: ${TELEGRAM_FRONTEND_ENABLED:-true}
      MATTERMOST_FRONTEND_ENABLED: ${MATTERMOST_FRONTEND_ENABLED:-false}
      MATTERMOST_INTERNAL_URL: ${MATTERMOST_INTERNAL_URL:-http://mattermost:8065}
      MATTERMOST_BOT_TOKEN: ${MATTERMOST_BOT_TOKEN:-}
      MATTERMOST_BOT_USER_ID: ${MATTERMOST_BOT_USER_ID:-}
      ALLOWED_MATTERMOST_USER_IDS: ${ALLOWED_MATTERMOST_USER_IDS:-}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Europe/Bucharest}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-10}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-gpt-4o-mini-transcribe}
      OPEN_FOOD_FACTS_BASE_URL: ${OPEN_FOOD_FACTS_BASE_URL:-https://world.openfoodfacts.org/api/v2}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-}
      BROWSERLESS_BASE_URL: ${BROWSERLESS_BASE_URL:-}
      BROWSERLESS_TOKEN: ${BROWSERLESS_TOKEN:-}
      MANAGEMENT_PORT: ${MANAGEMENT_PORT:-8081}
      FOOD_JOURNAL_SCHEDULING_ENABLED: ${FOOD_JOURNAL_SCHEDULING_ENABLED:-true}
      FOOD_JOURNAL_OUTBOX_DELAY_MS: ${FOOD_JOURNAL_OUTBOX_DELAY_MS:-5000}
      FOOD_JOURNAL_INBOX_DELAY_MS: ${FOOD_JOURNAL_INBOX_DELAY_MS:-500}
    ports: ["127.0.0.1:8080:8080"]
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
  mattermost-db:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: ["mattermost"]
    environment:
      POSTGRES_DB: mattermost
      POSTGRES_USER: mattermost
      POSTGRES_PASSWORD: ${MATTERMOST_DATABASE_PASSWORD:-change-me-before-production}
    volumes: [mattermost-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mattermost -d mattermost"]
      interval: 5s
      timeout: 3s
      retries: 10
  mattermost:
    image: mattermost/mattermost-team-edition:10.11.0
    restart: unless-stopped
    profiles: ["mattermost"]
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mattermost:${MATTERMOST_DATABASE_PASSWORD:-change-me-before-production}@mattermost-db:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: ${MATTERMOST_PUBLIC_URL:-http://localhost:8065}
      MM_SERVICESETTINGS_LISTENADDRESS: :8065
    volumes: [mattermost-data:/opt/mattermost/data]
    ports: ["127.0.0.1:8065:8065"]
    depends_on:
      mattermost-db:
        condition: service_healthy
volumes:
  postgres-data:
  mattermost-db-data:
  mattermost-data:
