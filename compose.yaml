services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: foodjournal
      POSTGRES_USER: foodjournal
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-foodjournal}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-dev-db.sh:/docker-entrypoint-initdb.d/init-dev-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodjournal -d foodjournal"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports: ["127.0.0.1:5432:5432"]
  app:
    build: .
    init: true
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/foodjournal
      DATABASE_USERNAME: foodjournal
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-foodjournal}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      ALLOWED_TELEGRAM_USER_IDS: ${ALLOWED_TELEGRAM_USER_IDS}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Europe/Bucharest}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-10}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      OPEN_FOOD_FACTS_BASE_URL: ${OPEN_FOOD_FACTS_BASE_URL:-https://world.openfoodfacts.org/api/v2}
      MANAGEMENT_PORT: ${MANAGEMENT_PORT:-8081}
      FOOD_JOURNAL_SCHEDULING_ENABLED: ${FOOD_JOURNAL_SCHEDULING_ENABLED:-true}
      FOOD_JOURNAL_OUTBOX_DELAY_MS: ${FOOD_JOURNAL_OUTBOX_DELAY_MS:-5000}
    ports: ["127.0.0.1:8080:8080"]
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
