name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - name: Build container
        run: docker build --tag food-journal:${{ github.sha }} .
      - name: Compose smoke test
        env:
          DATABASE_PASSWORD: ci-password
          TELEGRAM_BOT_TOKEN: ci-token-not-a-secret
          TELEGRAM_WEBHOOK_SECRET: ci-webhook-secret
          ALLOWED_TELEGRAM_USER_IDS: '1'
        run: |
          docker compose up --build --detach
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/health; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Compose cleanup
        if: always()
        run: docker compose down --volumes --remove-orphans

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v5
