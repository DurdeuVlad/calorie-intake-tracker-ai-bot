spring:
  application.name: food-journal-bot
  datasource.url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/foodjournal}
  datasource.username: ${DATABASE_USERNAME:foodjournal}
  datasource.password: ${DATABASE_PASSWORD:foodjournal}
  jpa.hibernate.ddl-auto: validate
  flyway.enabled: true
server:
  forward-headers-strategy: framework
  shutdown: graceful
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${ADMIN_SESSION_COOKIE_SECURE:true}
        same-site: lax
spring.lifecycle.timeout-per-shutdown-phase: 30s
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
food-journal:
  telegram-token: ${TELEGRAM_BOT_TOKEN}
  webhook-secret: ${TELEGRAM_WEBHOOK_SECRET}
  allowed-telegram-user-ids: ${ALLOWED_TELEGRAM_USER_IDS:}
  default-timezone: ${DEFAULT_TIMEZONE:Europe/Bucharest}
  openai-api-key: ${OPENAI_API_KEY:}
  openai-model: ${OPENAI_MODEL:gpt-5.4-mini}
  agent-max-tool-calls: ${AGENT_MAX_TOOL_CALLS:10}
  gemini-api-key: ${GEMINI_API_KEY:}
  gemini-model: ${GEMINI_MODEL:gemini-3.6-flash}
  open-food-facts-base-url: ${OPEN_FOOD_FACTS_BASE_URL:https://world.openfoodfacts.org/api/v2}
  admin:
    bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:}
    bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD:}
    require-https: ${ADMIN_REQUIRE_HTTPS:true}
    trace-encryption-key: ${ADMIN_TRACE_ENCRYPTION_KEY:}
    trace-retention-days: ${ADMIN_TRACE_RETENTION_DAYS:14}
