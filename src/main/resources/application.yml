spring:
  application.name: food-journal-bot
  datasource.url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/foodjournal}
  datasource.username: ${DATABASE_USERNAME:foodjournal}
  datasource.password: ${DATABASE_PASSWORD:foodjournal}
  jpa.hibernate.ddl-auto: validate
  flyway.enabled: true
server:
  forward-headers-strategy: framework
  shutdown: graceful
spring.lifecycle.timeout-per-shutdown-phase: 30s
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
food-journal:
  telegram-token: ${TELEGRAM_BOT_TOKEN}
  webhook-secret: ${TELEGRAM_WEBHOOK_SECRET}
  allowed-telegram-user-ids: ${ALLOWED_TELEGRAM_USER_IDS:}
  default-timezone: ${DEFAULT_TIMEZONE:Europe/Bucharest}
  openai-api-key: ${OPENAI_API_KEY:}
  openai-model: ${OPENAI_MODEL:gpt-5.4-mini}
  agent-max-tool-calls: ${AGENT_MAX_TOOL_CALLS:10}
  openai-transcription-model: ${OPENAI_TRANSCRIPTION_MODEL:gpt-4o-mini-transcribe}
  open-food-facts-base-url: ${OPEN_FOOD_FACTS_BASE_URL:https://world.openfoodfacts.org/api/v2}
  searxng-base-url: ${SEARXNG_BASE_URL:}
  browserless-base-url: ${BROWSERLESS_BASE_URL:}
  browserless-token: ${BROWSERLESS_TOKEN:}
  frontends:
    telegram:
      enabled: ${TELEGRAM_FRONTEND_ENABLED:true}
      allowed-user-ids: ${ALLOWED_TELEGRAM_USER_IDS:}
    mattermost:
      enabled: ${MATTERMOST_FRONTEND_ENABLED:false}
      internal-url: ${MATTERMOST_INTERNAL_URL:}
      bot-token: ${MATTERMOST_BOT_TOKEN:}
      bot-user-id: ${MATTERMOST_BOT_USER_ID:}
      allowed-user-ids: ${ALLOWED_MATTERMOST_USER_IDS:}
