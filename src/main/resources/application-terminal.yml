spring:
  main:
    web-application-type: none
  datasource:
    url: ${TERMINAL_DATABASE_URL:jdbc:postgresql://localhost:5432/foodjournal_dev}
    username: ${TERMINAL_DATABASE_USERNAME:foodjournal}
    password: ${TERMINAL_DATABASE_PASSWORD:${DATABASE_PASSWORD:foodjournal}}
food-journal:
  scheduling-enabled: false
  inbox-delay-ms: 100
  outbox-delay-ms: 100
  terminal:
    runner-enabled: ${TERMINAL_RUNNER_ENABLED:true}
    user-id: ${TERMINAL_TELEGRAM_USER_ID:1}
    display-name: ${TERMINAL_DISPLAY_NAME:Local developer}
    eval-file: ${TERMINAL_EVAL_FILE:}
    report-file: ${TERMINAL_EVAL_REPORT_FILE:}
    eval-repeats: ${TERMINAL_EVAL_REPEATS:3}
    eval-scenario: ${TERMINAL_EVAL_SCENARIO:}
    eval-baseline-file: ${TERMINAL_EVAL_BASELINE_FILE:}
    eval-full-report: ${TERMINAL_EVAL_FULL_REPORT:true}
