<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Agent run</title><meta charset="utf-8"></head><body><p><a href="/admin/runs">← Runs</a></p><h1 th:text="${run.correlationId}"></h1><p><span th:text="${run.outcome}"></span> · <span th:text="${run.toolCallCount}"></span> tools · <span th:text="${run.errorCategory}"></span></p><h2>Private payload</h2><p th:if="${payload}" th:text="${payload}"></p><form th:action="@{/admin/runs/{id}/reveal/{type}(id=${run.correlationId},type='INPUT')}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input name="reason" placeholder="Audit reason" required><button>Reveal user input</button></form><form th:action="@{/admin/runs/{id}/reveal/{type}(id=${run.correlationId},type='FINAL_REPLY')}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input name="reason" placeholder="Audit reason" required><button>Reveal final reply</button></form><h2>Tool timeline</h2><table border="1"><tr><th>#</th><th>Tool</th><th>Result</th><th>Latency</th></tr><tr th:each="event:${events}"><td th:text="${event.sequenceNumber}"></td><td th:text="${event.toolName}"></td><td th:text="${event.resultCode}"></td><td th:text="${event.latencyMs}"></td></tr></table><h2>Integrations</h2><ul><li th:each="event:${integrations}" th:text="${event.provider+' '+event.operation+' '+event.outcome}"></li></ul></body></html>
