<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>API keys</title><meta charset="utf-8"></head><body><p><a href="/admin">← Overview</a></p><h1>API keys</h1><p th:if="${issued}">Copy this now; it will not be shown again: <code th:text="${issued.plaintext}"></code></p><form method="post" action="/admin/api-keys"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input name="name" placeholder="Key name" required><label th:each="scope:${scopes}"><input type="checkbox" name="scopes" th:value="${scope}" th:text="${scope.value}"></label><button>Create key</button></form><table border="1"><tr><th>Name</th><th>Prefix</th><th>Expiry</th><th>Revoked</th><th></th></tr><tr th:each="key:${keys}"><td th:text="${key.name}"></td><td th:text="${key.keyPrefix}"></td><td th:text="${key.expiresAt}"></td><td th:text="${key.revokedAt}"></td><td><form th:action="@{/admin/api-keys/{id}/revoke(id=${key.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button>Revoke</button></form></td></tr></table></body></html>
