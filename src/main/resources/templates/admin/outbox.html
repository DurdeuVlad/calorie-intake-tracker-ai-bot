<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Outbox</title><meta charset="utf-8"></head><body><p><a href="/admin">← Overview</a></p><h1>Outbound messages</h1><table border="1"><tr><th>ID</th><th>Chat</th><th>Status</th><th>Agent run</th></tr><tr th:each="message:${messages.content}"><td th:text="${message.id}"></td><td th:text="${message.chatId}"></td><td th:text="${message.status}"></td><td th:text="${message.agentRun == null ? '' : message.agentRun.correlationId}"></td></tr></table></body></html>
